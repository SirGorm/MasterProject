[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "strength-training-ml"
version = "2.0.0"
description = "Multi-task ML pipeline for strength training analysis"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "data*", "models*", "training*", "evaluation*", "utils*"]
